// Use this file to configure your DEDICATED server. 
// This config file is executed on server start.

// disable autoaim
sv_aim 0

// disable clients' ability to pause the server
pausable 0

// default server name. Change to "Bob's Server", etc.
hostname "eXe.MITOCONDRIA Argentina Server"

// region: 2 = South America
sv_region 2

// maximum client movement speed 
sv_maxspeed 320

// 20 minute timelimit
mp_timelimit 20

sv_cheats 0

// fast download URL
sv_downloadurl "http://chain.4evergaming.net/6851/"
sv_allowdownload 1
sv_allowupload 0

// network
sv_maxrate 100000
sv_minrate 50000
sv_maxupdaterate 101
sv_minupdaterate 30

// load ban files
exec listip.cfg
exec banned.cfg

