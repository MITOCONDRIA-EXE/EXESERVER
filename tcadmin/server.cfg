// Use this file to configure your DEDICATED server. 
// This config file is executed on server start.

// disable autoaim
sv_aim 0

// disable clients' ability to pause the server
pausable 0

// default server name. Change to "Bob's Server", etc.
hostname "eXe ARG | 1vs1 | FY_POOL_DAY | NIGHTMODE | RANGOS"

game_description "eXe"

// region: 2 = South America
sv_region 2

// maximum client movement speed 
sv_maxspeed 320

// 40 minute timelimit
mp_timelimit 40

// no freeze at round start
mp_freezetime 0

sv_cheats 0
mp_flashlight 1
// fast download URL
sv_downloadurl "http://chain.4evergaming.net/6851/"
sv_allowdownload 1
sv_allowupload 0

// network
sv_maxrate 100000
sv_minrate 50000
sv_maxupdaterate 101
sv_minupdaterate 30

// load ban files
exec listip.cfg
exec banned.cfg

// Reportes a Discord (/report)
exe_report_url "http://127.0.0.1:8765/"
